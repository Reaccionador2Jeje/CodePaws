name: Desktop builds and releases

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build desktop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: CodePaws-Windows
            archive_name: CodePaws-Windows.zip
          - os: ubuntu-latest
            artifact_name: CodePaws-Linux
            archive_name: CodePaws-Linux.zip

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller

      - name: Check Python syntax
        run: python -m compileall -q codepaws desktop_game.py

      - name: Build desktop executable
        run: pyinstaller --noconfirm --clean --windowed --name CodePaws --collect-all pygame --collect-all PIL desktop_game.py

      - name: Package Windows build
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path dist/CodePaws/* -DestinationPath ${{ matrix.archive_name }}

      - name: Package Linux build
        if: runner.os == 'Linux'
        run: |
          chmod +x dist/CodePaws/CodePaws
          cd dist
          zip -r ../${{ matrix.archive_name }} CodePaws

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.archive_name }}
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all platform builds
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release-assets/*
